<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><link rel="icon" href="data:,">
<title>omega://performance :: Sovereign Telemetry</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif}
body{background:#070b13;color:#e2e8f0;padding:24px}
.wrap{max-width:1120px;margin:0 auto}
h1{font-size:22px;color:#f8fafc;margin-bottom:4px}
.sub{font-size:12px;color:#64748b;margin-bottom:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(172px,1fr));gap:10px;margin-bottom:18px}
.card{background:#0f172a;border:1px solid #1e293b;border-radius:8px;padding:11px}
.k{font-size:11px;color:#94a3b8;text-transform:uppercase}
.v{font-size:20px;font-weight:700;color:#38bdf8;margin-top:4px;font-family:Consolas,monospace}
table{width:100%;border-collapse:collapse;background:#0f172a;border:1px solid #1e293b;border-radius:8px;overflow:hidden}
th,td{padding:8px 11px;text-align:left;border-bottom:1px solid #1e293b;font-size:12px}
th{background:#131e35;color:#94a3b8}
.tag{padding:2px 7px;border-radius:99px;font-size:11px;background:#1e293b;color:#cbd5e1}
.btn{background:#0369a1;color:#fff;border:none;border-radius:5px;padding:4px 9px;cursor:pointer;font-size:11px}
</style>
</head>
<body>
<div class="wrap">
  <h1>omega://performance <span style="color:#38bdf8;font-size:13px">LIVE TELEMETRY (2s Poll)</span></h1>
  <div class="sub">Host Shell + WebView2 Child RAM &bull; CPU% &bull; Shield + Cookie/Autoplay Guard &bull; Sovereign Corpus &bull; SH-XI Status</div>
  <div class="cards" id="cards"></div>
  <table>
    <thead><tr><th>Workspace</th><th>Container</th><th>Tab Title</th><th>State</th><th>RAM</th><th>Last Load</th><th>Actions</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</div>
<script>
function sendCmd(el){ if(window.chrome&&window.chrome.webview) window.chrome.webview.postMessage(el.getAttribute('data-cmd')); }
function pull(){
  fetch('http://127.0.0.1:9778/api/performance').then(function(r){return r.json();}).then(function(d){
    var m=[['Host Shell RAM',d.host_ram_mb+' MB'],['WebView2 Child RAM',d.webview_ram_mb+' MB'],['Process CPU',d.cpu_pct+'%'],['Tabs / Frozen',d.tabs_total+' / '+d.tabs_frozen+' Zz'],['Shield Trackers',d.shield_blocked],['Cookies / Autoplay',d.cookies_rejected+' / '+d.autoplay_blocked],['Corpus Size',d.corpus_files+' ('+d.corpus_mb+' MB)'],['Time Machine',d.timemachine_snaps+' snaps'],['SH-XI Loopback',d.shxi_status]];
    var ch=''; for(var i=0;i<m.length;i++) ch+='<div class="card"><div class="k">'+m[i][0]+'</div><div class="v">'+m[i][1]+'</div></div>';
    document.getElementById('cards').innerHTML=ch;
    var rh='';
    for(var j=0;j<d.tabs.length;j++){
      var t=d.tabs[j];
      rh+='<tr><td><span class="tag">'+t.workspace+'</span></td><td><span class="tag">'+t.container+'</span></td><td>'+t.title+'</td><td>'+(t.frozen?'FROZEN [Zz]':(t.active?'ACTIVE':'LIVE'))+'</td><td>'+t.ram_mb+' MB</td><td>'+t.load_ms+' ms</td><td><button class="btn" data-cmd="PERF_JUMP|'+t.id+'" onclick="sendCmd(this)">Jump</button> '+(!t.frozen&&!t.active?'<button class="btn" style="background:#9a3412" data-cmd="PERF_FREEZE|'+t.id+'" onclick="sendCmd(this)">Freeze</button>':'')+'</td></tr>';
    }
    document.getElementById('rows').innerHTML=rh;
  }).catch(function(){});
}
pull(); setInterval(pull,2000);
</script>
</body>
</html>
